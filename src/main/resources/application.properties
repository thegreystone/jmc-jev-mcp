# =============================================================================
# JMC Jev MCP Server Configuration
# =============================================================================
# Recordings are loaded on demand via the loadRecording tool, by absolute file path.
# The Jev API key is read from the JEV_KEY environment variable, not from config here.

# Logging -- keep stdout clean for STDIO transport
quarkus.log.console.enable=false
quarkus.log.file.enable=true
quarkus.log.file.path=jmc-jev-mcp-server.log

# Uber-jar for easy distribution
quarkus.package.jar.type=uber-jar

# Recordings, Jev's JSON and file paths only need the standard charsets every image has; all charsets
# would add ~5MiB of mapping tables.
quarkus.native.add-all-charsets=false

# Native image: the analysis rules are discovered through ServiceLoader
# (META-INF/services/org.openjdk.jmc.flightrecorder.rules.IRule) and their summaries, explanations
# and solutions come from resource bundles, so both have to be pulled into the binary explicitly.
quarkus.native.auto-service-loader-registration=true
quarkus.native.resources.includes=**/messages*.properties,**/*.xslt,**/jfrprobes_schema.xsd
quarkus.native.include-reasons=true
# -Os: optimize for size. The ServiceLoader exclusion drops java.desktop's URL content handlers
# (audio/image) which would otherwise pull the whole Java Sound stack into the image.
quarkus.native.additional-build-args=-Os,-H:ServiceLoaderFeatureExcludeServiceProviders=sun.awt.www.content.MultimediaContentHandlers

# TypeSafe Jev REST client
quarkus.rest-client."jev-api".url=https://api.typesafe.ai
quarkus.rest-client."jev-api".scope=jakarta.inject.Singleton
